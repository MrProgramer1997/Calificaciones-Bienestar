name: Validar Calificaciones Bienestar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v6
      - name: Verificar interfaz y sintaxis JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = [s for s in re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', html, re.I) if s.strip()]
          assert len(scripts) == 1, 'Debe existir exactamente un script propio'
          for key in ('mostEvaluatedArea','bestArea','worstArea','byAreaVolume','byAreaSatisfaction','export','qrGrid','printSheet'):
              assert 'id="'+key+'"' in html, 'Falta el indicador '+key
          assert 'function descargarExcel()' in scripts[0]
          assert 'function renderAreaInsights()' in scripts[0]
          assert 'function prepararNuevaEvaluacion()' in scripts[0], 'Falta reiniciar el formulario tras un envío'
          assert 'availableScores=[1,2,4,5]' in scripts[0], 'La escala neutra debe estar retirada'
          assert 'id="evaluado"' in html, 'Falta el selector de personas antes del área'
          assert 'id="collaboratorName"' in html, 'Falta el campo de nombre'
          assert 'name="nombre_colaborador"' in html and 'required>' in html, 'El nombre debe ser obligatorio'
          assert 'nameToggle' not in html, 'Debe retirarse el botón opcional'
          assert 'nombre_colaborador:nombre,comentario:' in scripts[0], 'El nombre no se envía al backend'
          assert 'nombre_colaborador:safeExcelText' in scripts[0], 'No se exporta de manera segura el nombre en Excel'
          assert 'confidencial' not in html.lower(), 'Debe retirarse el término confidencial de la encuesta'
          api_source = Path('supabase/functions/calificaciones-bienestar/index.ts').read_text(encoding='utf-8')
          assert 'nombre_colaborador:nombre,calificacion' in api_source, 'El backend debe guardar el nombre obligatorio'
          assert 'if(typeof v.nombre_colaborador!=="string")' in api_source, 'Falta validación del nombre en backend'
          assert 'nombre_colaborador,calificacion' in api_source, 'Backend no devuelve el nombre al panel'
          assert 'function evaluatedName(v)' in scripts[0], 'Los registros deben conservar trazabilidad por persona'
          assert 'function descargarExcel()' in scripts[0], 'No debe perderse la exportación'
          assert 'if(enviandoEvaluacion)return' in scripts[0], 'Falta bloqueo contra doble clic durante el envío'
          assert 'mostrarConfirmacion()' in scripts[0], 'Falta confirmación después del envío'
          assert 'Calificar otra atención' in html, 'Falta botón para repetir una evaluación'
          assert 'id="faces"' in html, 'Se perdieron las calificaciones'
          style = Path('assets/experience.css')
          assert style.is_file(), 'No se incluyo la hoja de estilos'
          css = style.read_text(encoding='utf-8')
          assert '@media(prefers-reduced-motion:reduce)' in css, 'Faltan ajustes de accesibilidad para movimiento'
          assert 'assets/experience.css' in html, 'No se carga la hoja de estilos'
          for fragment in ('hero-art','ui-smile','ui-chart','survey-card','icon-sprite'):
              assert fragment in html, 'Falta componente visual '+fragment
          Path('/tmp/bienestar-inline.js').write_text(scripts[0], encoding='utf-8')
          PY
          node --check /tmp/bienestar-inline.js
      - name: Comprobar API de Supabase y permisos
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 3 --max-time 30 \
            "https://wcubfrmfylvrdwweothd.supabase.co/functions/v1/calificaciones-bienestar?action=catalog" \
            -o /tmp/catalogo-bienestar.json
          python3 - <<'PY'
          import json
          with open('/tmp/catalogo-bienestar.json', encoding='utf-8') as f:
              data = json.load(f)
          assert len(data.get('cargos', [])) == 6, "No se recuperaron los seis cargos"
          assert len(data.get('areas', [])) == 20, "El catalogo de areas no esta disponible"
          personas = [c.get('persona_nombre') for c in data['cargos']]
          assert all(isinstance(n,str) and n.strip() for n in personas), 'Hay personas sin nombre'
          assert len(set(personas)) == 6, 'Se esperan seis personas distintas'
          print("OK: seis cargos y veinte areas disponibles")
          PY
          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
            "https://wcubfrmfylvrdwweothd.supabase.co/functions/v1/calificaciones-bienestar?action=results")
          test "$status" = "401"
          echo "OK: los resultados no son publicos"
