name: Validar Calificaciones Bienestar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v6
      - name: Verificar interfaz y sintaxis JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = [s for s in re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', html, re.I) if s.strip()]
          assert len(scripts) == 1, 'Debe existir exactamente un script propio'
          for key in ('mostEvaluatedArea','bestArea','worstArea','byAreaVolume','byAreaSatisfaction','export','qrGrid','printSheet'):
              assert 'id="'+key+'"' in html, 'Falta el indicador '+key
          assert 'function descargarExcel()' in scripts[0]
          assert 'function renderAreaInsights()' in scripts[0]
          Path('/tmp/bienestar-inline.js').write_text(scripts[0], encoding='utf-8')
          PY
          node --check /tmp/bienestar-inline.js
      - name: Comprobar API de Supabase y permisos
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 3 --max-time 30 \
            "https://wcubfrmfylvrdwweothd.supabase.co/functions/v1/calificaciones-bienestar?action=catalog" \
            -o /tmp/catalogo-bienestar.json
          python3 - <<'PY'
          import json
          with open('/tmp/catalogo-bienestar.json', encoding='utf-8') as f:
              data = json.load(f)
          assert len(data.get('cargos', [])) == 6, "No se recuperaron los seis cargos"
          assert len(data.get('areas', [])) == 20, "El catalogo de areas no esta disponible"
          print("OK: seis cargos y veinte areas disponibles")
          PY
          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
            "https://wcubfrmfylvrdwweothd.supabase.co/functions/v1/calificaciones-bienestar?action=results")
          test "$status" = "401"
          echo "OK: los resultados no son publicos"
